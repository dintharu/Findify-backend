server:
  port: 8084

spring:
  application:
    name: image-tracking-service

  # Enable multipart file uploads for image processing
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Enhanced Feign client configuration with better error handling
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 15000
        loggerLevel: full
      email-service:
        connectTimeout: 3000
        readTimeout: 10000
      item-service:
        connectTimeout: 5000
        readTimeout: 10000
  # Enable circuit breaker for resilience
  circuitbreaker:
    enabled: true

# Circuit breaker configuration
resilience4j:
  circuitbreaker:
    instances:
      email-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      item-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always

# Logging configuration
logging:
  level:
    edu.icet.ecom: DEBUG
    feign: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    root: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"